spring:
  datasource:
    # Use environment variables in local/CI environments.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/account_lifecycle}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

security:
  jwt:
    # Never commit real secrets. Provide through environment variables.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    algorithm: ${JWT_ALGORITHM:HS256}
    required-claims:
      - sub
      - roles
      - iat
      - exp
